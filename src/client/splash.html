<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Pakia Pakia! | Daily bagging puzzle</title>
  </head>
  <body>
    <main class="card" id="card">
      <div class="bag-art" id="bag" aria-hidden="true">
        <div class="peek" id="peek"></div>
        <div class="paper-bag"><span>Pakia!</span></div>
      </div>
      <div class="info">
        <div class="brand">Pakia Pakia<em>!</em></div>
        <div class="date" id="date">Today's bag</div>
        <div class="slip">
          <div class="slip-label">Today's customer</div>
          <div class="slip-title" id="title">&nbsp;</div>
          <div class="slip-meta" id="meta">&nbsp;</div>
        </div>
        <button class="cta" id="play" type="button">Start bagging</button>
        <div class="stats" id="stats">&nbsp;</div>
      </div>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
